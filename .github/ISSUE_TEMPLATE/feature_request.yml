name: ✨ Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tayori is small and opinionated on purpose — see
        [CONTEXT.md](https://github.com/cflarios/Tayori/blob/main/CONTEXT.md) for
        the why behind some choices. A clear problem statement helps more than a
        finished design.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and didn't find the same request
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Tayori makes hard today?
      placeholder: During an interview I need to…, but currently…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How would you want it to work? Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve it, or how you work around it now.
    validations:
      required: false
