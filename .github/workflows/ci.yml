name: Build portable executable

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build portable .exe
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 11 blocks install scripts by default, so Electron's postinstall —
      # which downloads the platform binary — doesn't reliably run during
      # `npm ci`. The test suite pulls in the LLM factory, which imports
      # `electron`, and without the binary `getElectronPath()` throws and fails
      # the run. Install it explicitly so a skipped or hiccuped postinstall can't
      # break CI (see CONTEXT.md §3).
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Run checks
        run: npm run typecheck && npm run lint && npm test

      - name: Build portable executable
        run: npm run build:portable

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Helper-portable-${{ github.sha }}
          path: release/*-portable.exe
          if-no-files-found: error
          retention-days: 30
