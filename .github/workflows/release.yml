name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create versioned release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-release-assets:
    name: Attach portable release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out released version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run build:portable

      - name: Package and attach release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $artifact = Get-ChildItem -Path release -Filter '*-portable.exe' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Portable executable not found.' }
          $zipPath = Join-Path $artifact.DirectoryName "$($artifact.BaseName).zip"
          Compress-Archive -LiteralPath $artifact.FullName -DestinationPath $zipPath -Force
          # SHA-256 checksums so users can verify the download is byte-for-byte
          # what CI built. The app ships unsigned, so this is the integrity check
          # that stands in for a signature. Format matches `sha256sum -c`:
          # lowercase hash, two spaces, bare file name.
          $sumsPath = Join-Path $artifact.DirectoryName 'SHA256SUMS.txt'
          Get-FileHash -Algorithm SHA256 $artifact.FullName, $zipPath |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path $sumsPath -Encoding ascii
          gh release upload $env:TAG_NAME $artifact.FullName $zipPath $sumsPath --clobber
