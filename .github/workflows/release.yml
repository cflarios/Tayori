name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create versioned release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  attach-portable-executable:
    name: Attach portable .exe
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out released version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run build:portable

      - name: Attach executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $artifact = Get-ChildItem -Path release -Filter '*-portable.exe' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Portable executable not found.' }
          gh release upload $env:TAG_NAME $artifact.FullName --clobber
