## Rebuilds and publishes the portable .exe of a tag that ALREADY exists.
##
## It's the manual escape valve, not the normal path: that's handled by
## `release.yml`, which creates the tag and attaches the binaries when merging the
## release PR. This workflow is for when that job failed, when a binary has to be
## remade, or when the release was created by hand.
##
## It was born because `release.yml` depends on Release Please being able to OPEN a
## pull request, and that comes disabled by default in GitHub ("Allow GitHub
## Actions to create and approve pull requests"). With that option off,
## release-please computes the version, generates the CHANGELOG, creates the
## branch... and dies at the last step, leaving the repository without a release.
## Creating a RELEASE, by contrast, is allowed with `contents: write`.
##
## **No tag trigger on purpose.** Now that the tags are `v*` in both places,
## hooking it to `push: tags` would make each release build twice in parallel,
## about eight minutes of Windows runner for the same binary.

name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish portable .exe
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before publishing
        run: npm run typecheck && npm run lint && npm test

      - name: Build portable executable
        run: npm run build:portable

      - name: Create release and attach assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          $artifact = Get-ChildItem -Path release -Filter '*-portable.exe' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'No se generó el ejecutable portable.' }

          # The .zip exists because Windows SmartScreen and some download
          # managers treat a loose .exe far worse than a compressed one.
          $zip = Join-Path $artifact.DirectoryName "$($artifact.BaseName).zip"
          Compress-Archive -LiteralPath $artifact.FullName -DestinationPath $zip -Force

          # The notes come from the CHANGELOG that Release Please already generated.
          $notes = if (Test-Path CHANGELOG.md) { 'CHANGELOG.md' } else { $null }

          $exists = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $artifact.FullName $zip --clobber
          } elseif ($notes) {
            gh release create $env:TAG $artifact.FullName $zip --title $env:TAG --notes-file $notes
          } else {
            gh release create $env:TAG $artifact.FullName $zip --title $env:TAG --generate-notes
          }
