## Reconstruye y publica el .exe portable de un tag que YA existe.
##
## Es la válvula de escape manual, no el camino normal: de eso se encarga
## `release.yml`, que crea el tag y adjunta los binarios al fusionar la PR de
## release. Este workflow sirve cuando ese job falló, cuando hay que rehacer un
## binario, o cuando el release se creó a mano.
##
## Nació porque `release.yml` depende de que Release Please pueda ABRIR una pull
## request, y eso viene desactivado por defecto en GitHub ("Allow GitHub Actions
## to create and approve pull requests"). Con esa opción apagada, release-please
## calcula la versión, genera el CHANGELOG, crea la rama... y muere en el último
## paso, dejando el repositorio sin release. Crear un RELEASE, en cambio, sí
## está permitido con `contents: write`.
##
## **Sin disparo por tag a propósito.** Ahora que los tags son `v*` en los dos
## sitios, engancharlo a `push: tags` haría que cada release compilara dos veces
## en paralelo, unos ocho minutos de runner de Windows para el mismo binario.

name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag ya existente que se quiere publicar (ej. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish portable .exe
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before publishing
        run: npm run typecheck && npm run lint && npm test

      - name: Build portable executable
        run: npm run build:portable

      - name: Create release and attach assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          $artifact = Get-ChildItem -Path release -Filter '*-portable.exe' | Select-Object -First 1
          if ($null -eq $artifact) { throw 'No se generó el ejecutable portable.' }

          # El .zip existe porque Windows SmartScreen y algunos gestores de
          # descarga tratan mucho peor un .exe suelto que uno comprimido.
          $zip = Join-Path $artifact.DirectoryName "$($artifact.BaseName).zip"
          Compress-Archive -LiteralPath $artifact.FullName -DestinationPath $zip -Force

          # Las notas salen del CHANGELOG que ya generó Release Please.
          $notes = if (Test-Path CHANGELOG.md) { 'CHANGELOG.md' } else { $null }

          $exists = gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $artifact.FullName $zip --clobber
          } elseif ($notes) {
            gh release create $env:TAG $artifact.FullName $zip --title $env:TAG --notes-file $notes
          } else {
            gh release create $env:TAG $artifact.FullName $zip --title $env:TAG --generate-notes
          }
