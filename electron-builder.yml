# NO cambiar `appId`: identifica la instalación para NSIS, y cambiarlo orfanaría
# las instalaciones existentes (una actualización se vería como una app nueva).
appId: com.interviewhelper.app
# La marca que ve el usuario: el descargable, el .exe, el acceso directo y la
# imagen del proceso en el Administrador de tareas. Antes iba con un nombre neutro
# ("Audio Helper") para no delatar de un vistazo qué es la app; se decidió usar la
# marca real, porque el sigilo que de verdad importa —invisible al compartir
# pantalla, vía setContentProtection— no depende de este nombre. Es solo cosmético
# y se puede cambiar sin romper nada: `app.name` (la ruta de userData con los
# ajustes y las API keys cifradas) NO sale de aquí, sino de `package.json` `name`
# y de `app.setName('interview-helper')` en main/index.ts, que siguen intactos.
productName: Tayori
executableName: Tayori
copyright: MIT

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# No hay módulos nativos que reconstruir: whisper.cpp se usa como binario
# externo descargado en tiempo de ejecución, no como binding de Node. Eso evita
# electron-rebuild, node-gyp y la dependencia de Visual Studio Build Tools.
npmRebuild: false

win:
  # Icono del .exe (y del instalador y accesos directos): el fantasmita de Tayori.
  # Es un .ico multi-tamaño (256→16) generado desde `build/icon.svg` con
  # `scripts/make-icon.mjs`. `build/` es la carpeta de buildResources, así que
  # electron-builder lo encuentra solo, pero se deja explícito.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Sin firma de código: es una app personal. Windows SmartScreen avisará la
  # primera vez, lo que es esperado y está documentado en el README.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Coherente con la marca: el acceso directo también lleva el nombre real.
  shortcutName: Tayori

portable:
  artifactName: ${productName}-${version}-portable.exe

# Los assets de Whisper (binario y modelos) NO se empaquetan: son cientos de
# megas que la mayoría de usuarios no necesitan si usan Gemini Live. Se
# descargan bajo demanda desde el dashboard a userData.
