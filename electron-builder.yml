appId: com.interviewhelper.app
# Nombre neutro a propósito: es lo que ve el Administrador de tareas (nombre de
# imagen del .exe y FileDescription/ProductName en los recursos de versión), los
# accesos directos y el instalador. Genérico y plausible durante una llamada, y
# NO imita un proceso real de Windows (svchost, RuntimeBroker…) porque eso
# dispararía el antivirus. Cámbialo por el que prefieras: es solo cosmético.
# La marca "Tayori" que ve el usuario vive en la UI (código), no aquí,
# y `app.name` (ruta de userData) se ancla en main/index.ts, no en este campo.
productName: Audio Helper
executableName: Audio Helper
copyright: MIT

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# No hay módulos nativos que reconstruir: whisper.cpp se usa como binario
# externo descargado en tiempo de ejecución, no como binding de Node. Eso evita
# electron-rebuild, node-gyp y la dependencia de Visual Studio Build Tools.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Sin firma de código: es una app personal. Windows SmartScreen avisará la
  # primera vez, lo que es esperado y está documentado en el README.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Coherente con el nombre neutro: el acceso directo tampoco debe delatar.
  shortcutName: Audio Helper

portable:
  artifactName: ${productName}-${version}-portable.exe

# Los assets de Whisper (binario y modelos) NO se empaquetan: son cientos de
# megas que la mayoría de usuarios no necesitan si usan Gemini Live. Se
# descargan bajo demanda desde el dashboard a userData.
