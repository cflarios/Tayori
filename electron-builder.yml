# Do NOT change `appId`: it identifies the installation for NSIS, and changing it
# would orphan existing installations (an update would look like a new app).
appId: com.interviewhelper.app
# The brand the user sees: the download, the .exe, the shortcut and the process
# image in Task Manager. It used to carry a neutral name ("Audio Helper") so as
# not to give away at a glance what the app is; it was decided to use the real
# brand, because the stealth that really matters —invisible when sharing the
# screen, via setContentProtection— doesn't depend on this name. It's only
# cosmetic and can be changed without breaking anything: `app.name` (the userData
# path with the settings and the encrypted API keys) does NOT come from here, but
# from `package.json` `name` and from `app.setName('interview-helper')` in
# main/index.ts, which stay intact.
productName: Tayori
executableName: Tayori
copyright: MIT

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# There are no native modules to rebuild: whisper.cpp is used as an external
# binary downloaded at runtime, not as a Node binding. That avoids
# electron-rebuild, node-gyp and the Visual Studio Build Tools dependency.
npmRebuild: false

win:
  # Icon of the .exe (and of the installer and shortcuts): the Tayori ghost.
  # It's a multi-size .ico (256→16) generated from `build/icon.svg` with
  # `scripts/make-icon.mjs`. `build/` is the buildResources folder, so
  # electron-builder finds it on its own, but it's left explicit.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code signing: it's a personal app. Windows SmartScreen will warn the
  # first time, which is expected and documented in the README.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Consistent with the brand: the shortcut also carries the real name.
  shortcutName: Tayori

portable:
  artifactName: ${productName}-${version}-portable.exe

# The Whisper assets (binary and models) are NOT packaged: they're hundreds of
# megs that most users don't need if they use Gemini Live. They're downloaded on
# demand from the dashboard to userData.
