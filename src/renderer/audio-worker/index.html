<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      `blob:` in script-src is necessary: the AudioWorklet is compiled from a Blob
      URL (see pcm-worklet.ts) so as not to depend on the hashed name Vite gives
      assets in production. Without this addModule() fails with "Unable to load a
      worklet's module".
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:"
    />
    <title>Audio Worker</title>
  </head>
  <body>
    <!-- UI-less window: never shown. It only hosts the capture pipeline. -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
