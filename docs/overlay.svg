<svg width="508" height="448" viewBox="176 4 508 448" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a45"/>
      <stop offset="1" stop-color="#14161f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.26" r="0.6">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect x="176" y="4" width="508" height="448" rx="20" fill="url(#backdrop)"/>
  <rect x="176" y="4" width="508" height="448" rx="20" fill="url(#glow)"/>

  <!-- Overlay panel -->
  <g filter="url(#cardShadow)">
    <rect x="230" y="40" width="400" height="372" rx="16" fill="#111317" stroke="#ffffff" stroke-opacity="0.09"/>
  </g>

  <!-- ── Status bar ── -->
  <circle cx="263" cy="66" r="8" fill="#34d399" fill-opacity="0.16"/>
  <circle cx="263" cy="66" r="4" fill="#34d399"/>
  <text x="277" y="70.5" fill="#e2e5e9" font-size="12.5" font-weight="600">Listen</text>
  <path d="M319 64 l3.5 3.5 l3.5 -3.5" stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- eye (visibility, hidden/safe state) -->
  <path d="M531 66 C 534 60.5, 544 60.5, 547 66 C 544 71.5, 534 71.5, 531 66 Z" stroke="#9aa0a6" stroke-width="1.4" fill="none"/>
  <circle cx="539" cy="66" r="2.3" fill="#9aa0a6"/>
  <!-- solve screen (icon only) -->
  <rect x="559" y="59" width="17" height="12.5" rx="2" stroke="#9aa0a6" stroke-width="1.4" fill="none"/>
  <line x1="564" y1="74.5" x2="571" y2="74.5" stroke="#9aa0a6" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M581 64.5 l2.6 2.6 l2.6 -2.6" stroke="#9aa0a6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ⋯ -->
  <circle cx="597" cy="66" r="1.7" fill="#b3b8bd"/>
  <circle cx="603.5" cy="66" r="1.7" fill="#b3b8bd"/>
  <circle cx="610" cy="66" r="1.7" fill="#b3b8bd"/>

  <line x1="250" y1="88" x2="610" y2="88" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- ── Profile + model row ── -->
  <rect x="250" y="100" width="106" height="25" rx="7" fill="#4c8dff" fill-opacity="0.13" stroke="#4c8dff" stroke-opacity="0.3"/>
  <circle cx="264" cy="109" r="3.4" stroke="#a8c7ff" stroke-width="1.4" fill="none"/>
  <path d="M259 118 q5 -5 10 0" stroke="#a8c7ff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <text x="276" y="116.5" fill="#a8c7ff" font-size="11.5" font-weight="600">Interview</text>
  <path d="M338 110 l3 3 l3 -3" stroke="#a8c7ff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="482" y="100" width="128" height="25" rx="7" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M495 108 l1.6 3.2 l3.2 1.6 l-3.2 1.6 l-1.6 3.2 l-1.6 -3.2 l-3.2 -1.6 l3.2 -1.6 z" fill="#c4b5fd"/>
  <text x="505" y="116.5" fill="#c8ccd0" font-size="11.5">Claude Sonnet</text>
  <path d="M593 110 l3 3 l3 -3" stroke="#9aa0a6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Tabs ── -->
  <text x="250" y="152" fill="#e2e5e9" font-size="11" font-weight="600" letter-spacing="0.6">LISTEN</text>
  <text x="312" y="152" fill="#7c8288" font-size="11" letter-spacing="0.6">WRITE</text>
  <line x1="250" y1="160" x2="610" y2="160" stroke="#ffffff" stroke-opacity="0.05"/>
  <line x1="249" y1="160" x2="298" y2="160" stroke="#60a5fa" stroke-width="1.6"/>

  <!-- ── Answer header ── -->
  <text x="250" y="185" fill="#7c8288" font-size="10.5">&#8249; 2/5 &#8250;</text>
  <rect x="486" y="176" width="66" height="16" rx="4" fill="#ffffff" fill-opacity="0.05"/>
  <text x="493" y="187.5" fill="#8b9096" font-size="9.5">memory 2/8</text>
  <rect x="560" y="175" width="50" height="18" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="571" y="187.5" fill="#c8ccd0" font-size="10">Copy</text>

  <!-- ── Question ── -->
  <text x="250" y="210" fill="#7c8288" font-size="9.5" letter-spacing="0.8">QUESTION</text>
  <text x="250" y="230" fill="#c8ccd0" font-size="13.5">How would you handle a 10&#215; traffic</text>
  <text x="250" y="249" fill="#c8ccd0" font-size="13.5">spike at checkout?</text>

  <line x1="250" y1="264" x2="610" y2="264" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- ── Answer bullets ── -->
  <circle cx="253" cy="285" r="2" fill="#4c8dff"/>
  <text x="266" y="289" fill="#e6e5f2" font-size="13">Numbers first: current RPS and expected peak.</text>

  <circle cx="253" cy="311" r="2" fill="#4c8dff"/>
  <text x="266" y="315" fill="#e6e5f2" font-size="13">Read-through cache, and queue the writes.</text>

  <circle cx="253" cy="337" r="2" fill="#4c8dff"/>
  <text x="266" y="341" fill="#e6e5f2" font-size="13">Autoscale horizontally, with cost caps.</text>

  <circle cx="253" cy="363" r="2" fill="#4c8dff"/>
  <text x="266" y="367" fill="#e6e5f2" font-size="13">Feature flag to degrade gracefully.</text>

  <!-- ── Footer ── -->
  <text x="250" y="394" fill="#6b7075" font-size="10.5">Ctrl+Enter to ask</text>
  <text x="540" y="394" fill="#7c8288" font-size="10.5">S</text>
  <rect x="551" y="384" width="16" height="14" rx="4" fill="#60a5fa" fill-opacity="0.16"/>
  <text x="555" y="394" fill="#a8c7ff" font-size="10.5">M</text>
  <text x="573" y="394" fill="#7c8288" font-size="10.5">L</text>
  <text x="587" y="394" fill="#7c8288" font-size="10.5">XL</text>

  <!-- ── Floating "hidden" chip ── -->
  <g filter="url(#cardShadow)">
    <rect x="318" y="398" width="224" height="30" rx="15" fill="#16181d" stroke="#ffffff" stroke-opacity="0.1"/>
  </g>
  <path d="M335 413 C 337.5 408.5, 348.5 408.5, 351 413 C 348.5 417.5, 337.5 417.5, 335 413 Z" stroke="#67e8f9" stroke-width="1.3" fill="none"/>
  <circle cx="343" cy="413" r="2" fill="#67e8f9"/>
  <line x1="334" y1="407" x2="352" y2="419" stroke="#67e8f9" stroke-width="1.3" stroke-linecap="round"/>
  <text x="358" y="417.5" fill="#c8ccd0" font-size="11.5">Hidden while sharing your screen</text>
</svg>
